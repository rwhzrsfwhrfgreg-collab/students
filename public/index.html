<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Student App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app-container">
        <header>
            <h1>AI Student App</h1>
            <p>Upload a PDF textbook and start chatting!</p>
        </header>

        <div id="upload-container">
            <form id="upload-form">
                <label for="file-input">Choose a PDF file:</label>
                <input type="file" id="file-input" name="file" accept=".pdf" required>
                <button type="submit" id="upload-button">Upload</button>
            </form>
        </div>

        <div id="chat-container">
            <div id="chat-messages">
                <!-- System and chat messages will appear here -->
            </div>
            <div id="chat-input-container">
                <input type="text" id="message-input" placeholder="Ask a question about your document..." disabled>
                <button id="send-button" disabled>Send</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
